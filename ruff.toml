line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # long lines are allowed in docstrings that explain a design decision
]

[lint.per-file-ignores]
"ml/plots.py" = ["E402"]  # matplotlib backend must be set before pyplot import
